<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Space</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* RESET */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffe6f0, #fff0f5);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* CARD */
  .card {
    background: rgba(255, 240, 245, 0.95);
    border-radius: 28px;
    padding: 36px 28px;
    max-width: 400px;
    width: 90%;
    text-align: center;
    box-shadow: 0 16px 40px rgba(255,182,193,0.35);
    position: relative;
  }

  h2 {
    color: #ff6f91;
    margin-bottom: 20px;
    font-weight: 600;
  }

  /* PASSWORD INPUT */
  #passwordBox {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: 2px solid #ffb6c1;
    background: #fff0f5;
    color: #333;
    font-size: 16px;
    outline: none;
    box-shadow: 0 6px 15px rgba(255,182,193,0.3);
    margin-bottom: 12px;
    transition: 0.3s;
  }

  #passwordBox:focus {
    border-color: #ff6f91;
    box-shadow: 0 6px 20px rgba(255,111,145,0.4);
  }

  /* SUBMIT BUTTON */
  #submitBtn {
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #ffb6c1, #ff6f91);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,111,145,0.55);
    transition: transform 0.15s ease, opacity 0.25s ease;
  }

  #submitBtn:active {
    transform: scale(0.96);
  }

  /* ERROR MESSAGE */
  #errorMsg {
    color: #ff4d4d;
    margin-top: 8px;
    font-size: 14px;
    display: none;
  }

  /* SECRET PARAGRAPH */
  #secretText {
    display: none;
    margin-top: 24px;
    font-size: 16px;
    line-height: 1.6;
    color: #ff4d94;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="card">
  <h2>Enter Password</h2>
  <input type="password" id="passwordBox" placeholder="Type here...">
  <button id="submitBtn">Unlock</button>
  <div id="errorMsg">Incorrect password!</div>
  <p id="secretText">
    The day I met you was the most perfect moment. I know this may not be much of a gift, 
    but I poured my heart into this little website, made just for you, just for us. ❤️
  </p>
</div>

<script>
  const passwordBox = document.getElementById('passwordBox');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const secretText = document.getElementById('secretText');

  const PASSWORD = "gandu"; // change password here

  submitBtn.addEventListener('click', () => {
    if(passwordBox.value === PASSWORD){
      secretText.style.display = 'block';
      errorMsg.style.display = 'none';
      passwordBox.style.display = 'none';
      submitBtn.style.display = 'none';
    } else {
      errorMsg.style.display = 'block';
    }
  });

  passwordBox.addEventListener('keypress', (e) => {
    if(e.key === 'Enter'){
      submitBtn.click();
    }
  });
</script>
</body>
  </html>
