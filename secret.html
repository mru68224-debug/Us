<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise! 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3rem; color: #d63384; margin: 0 0 10px; }
        p { color: #666; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(220, 39, 67, 0.3);
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="modal">
        <h1>You found it! 🎉</h1>
        <p>Here is your special birthday surprise.</p>
        <!-- REPLACE THE LINK BELOW -->
        <a href="https://www.instagram.com/your_post_link" class="btn" target="_blank">
            Open Message 💌
        </a>
    </div>
</body>
</html>
