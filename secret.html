<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* RESET */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
    background: #0f0f11;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* CARD */
  .card {
    max-width: 440px;
    padding: 40px 30px;
    border-radius: 28px;
    background: linear-gradient(135deg, #ff6f91, #ff9eb5, #ffd1dd, #ff9eb5, #ff6f91);
    background-size: 400% 400%;
    animation: gradientFlow 12s ease infinite;
    color: #fff;
    text-align: center;
    box-shadow: 0 18px 55px rgba(255,111,145,0.45);
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card p {
    font-size: 16px;
    line-height: 1.7;
    color: #fff;
    letter-spacing: 0.3px;
    margin-bottom: 30px;
  }

  /* PASSWORD INPUT */
  .password-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .password-section input {
    padding: 12px 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    text-align: center;
  }

  .password-section button {
    padding: 12px 24px;
    border-radius: 999px;
    border: none;
    background: #ff6f91;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .password-section button:active {
    transform: scale(0.96);
  }

  .hidden-content {
    display: none;
    margin-top: 20px;
    font-size: 16px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="card">
  <p>
    I still remember the first magical moment we met. It may not be much, but I made this website with all my heart, just for you, just for us.
  </p>

  <div class="password-section">
    <input type="password" id="pwdInput" placeholder="Enter password">
    <button id="pwdBtn">Enter</button>
  </div>

  <div class="hidden-content" id="secretContent">
    <p>Thank you for being the most beautiful part of my life. This is our little secret corner, just for us 💖</p>
  </div>
</div>

<script>
const pwdBtn = document.getElementById('pwdBtn');
const pwdInput = document.getElementById('pwdInput');
const secretContent = document.getElementById('secretContent');

pwdBtn.addEventListener('click', () => {
  if(pwdInput.value === 'love') { // <-- change password if you want
    secretContent.style.display = 'block';
    pwdInput.style.display = 'none';
    pwdBtn.style.display = 'none';
  } else {
    alert('Incorrect password 💔');
  }
});
</script>

</body>
  </html>
