<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surprise 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }
        .surprise-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255, 107, 129, 0.3);
            border: 2px solid rgba(255,255,255,1);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 400px;
        }
        h1 { font-family: 'Great Vibes', cursive; font-size: 4rem; color: #e65c6a; margin: 0; line-height: 1.2; }
        p { color: #6a5a6a; margin-bottom: 30px; font-size: 1.1rem; }
        .insta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.4);
            transition: transform 0.2s;
        }
        .insta-btn:hover { transform: scale(1.05) rotate(-2deg); }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        /* Floating shapes for background */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 6s ease-in-out infinite;
        }
        .s1 { width: 100px; height: 100px; background: #ff6b81; top: 10%; left: 10%; animation-delay: 0s; }
        .s2 { width: 60px; height: 60px; background: #ffeaa7; top: 70%; right: 15%; animation-delay: 1s; }
        .s3 { width: 80px; height: 80px; background: #dfe6e9; bottom: 10%; left: 20%; animation-delay: 2s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>
<body>
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>

    <div class="surprise-container">
        <h1>You did it!</h1>
        <p>Here is your special surprise. I love you! 💖</p>
        <a href="https://www.instagram.com/your_link_here" class="insta-btn" target="_blank">
            <span>Open Message</span>
            <span>💌</span>
        </a>
    </div>
</body>
</html>
