<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* RESET */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
    background: #0f0f11;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* CARD */
  .card {
    max-width: 420px;
    padding: 36px 28px;
    border-radius: 28px;
    background: linear-gradient(135deg, #ff6f91, #ff9eb5, #ffd1dd, #ff9eb5, #ff6f91);
    background-size: 400% 400%;
    animation: gradientFlow 12s ease infinite;
    color: #fff;
    text-align: center;
    box-shadow: 0 18px 55px rgba(255,111,145,0.45);
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card p {
    font-size: 16px;
    line-height: 1.7;
    color: #fff;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<div class="card">
  <p>
    I still remember the perfect time when I met you. I know it's not much of a gift, 
    but this website I made with my whole heart, just for you, just for us.
  </p>
</div>

</body>
</html>
