<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* BASE */
html, body {
  width: 100%;
  min-height: 100%;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  overflow-x: hidden;
}

/* LOCK SCREEN */
#lockScreen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: radial-gradient(circle at top, rgba(255,158,181,0.18), rgba(15,15,17,0.95));
  backdrop-filter: blur(10px);
  z-index: 9999;
}

/* LOCK BOX */
.lock-box {
  width: 90%;
  max-width: 320px;
  text-align: center;
  padding: 28px 22px 30px;
  border-radius: 26px;
  background: rgba(20,20,24,0.85);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
}

.lock-title { color: #fff; font-size: 18px; margin-bottom: 20px; }

.lock-box input {
  width: 100%;
  padding: 14px;
  border-radius: 18px;
  border: none;
  outline: none;
  background: #1a1a1f;
  color: #fff;
  font-size: 16px;
  text-align: center;
  margin-bottom: 16px;
}

.lock-box button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #ff9eb5, #ff6f91);
  color: #111;
  font-weight: 600;
  cursor: pointer;
}

/* CARD, VIDEO, TEXT, LINKS, etc. */
.card { /* keep your previous styles */ }
.flower-frame { /* keep your previous styles */ }
.message-card { /* keep your previous styles */ }
.music-btn { /* keep your previous styles */ }

</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <p class="lock-title">Enter password</p>
    <input type="password" id="mainPass" placeholder="••••••">
    <button onclick="unlock()">Unlock</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="card">
  <div class="flower-frame">
    <video id="heroVideo" muted loop autoplay playsinline>
      <source src="her-video.mp4" type="video/mp4">
    </video>
  </div>
  <p class="subtitle">I made this little space just for us</p>
  <button class="music-btn" id="musicBtn">Tap to play 🎶</button>

  <a href="https://swanasoni.in/secret.html">Secret</a>
  <a href="https://swanasoni.in/prettiest.html">Prettiest</a>
  <a href="https://swanasoni.in/cutest.html">Cutest</a>
  <a href="https://swanasoni.in/us.html">Us</a>
</div>

<div class="card message-card">
  <p class="message-text">
    <!-- your loving message -->
  </p>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const HOME_PASSWORD = "swanappkp";
const music = document.getElementById("bgMusic");
const btn = document.getElementById("musicBtn");

function unlock() {
  const input = document.getElementById("mainPass").value;
  if(input === HOME_PASSWORD){
    document.getElementById("lockScreen").style.display = "none";
    music.volume = 0.6;
    music.play().catch(()=>{}); // start music after password
  } else {
    document.querySelector(".lock-title").innerText = "baby try again mwah";
  }
}

btn.addEventListener("click", () => {
  if(music.paused){
    music.play();
    btn.textContent = "Playing 🎶";
  } else {
    music.pause();
    btn.textContent = "Paused ⏸️";
  }
});
</script>

</body>
</html>
