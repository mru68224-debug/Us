<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
}

.card {
  max-width: 420px;
  margin: 32px auto;
  padding: 26px 22px 30px;
  border-radius: 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
  color: #fff;

  background: linear-gradient(120deg,#ff6f91,#ff9eb5,#ffd1dd,#ff9eb5,#ff6f91);
  background-size: 500% 500%;
  animation: FLOW 12s linear infinite;
}

@keyframes FLOW {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(10,10,14,.7);
  backdrop-filter:blur(6px);
}

.card>*{position:relative;z-index:1}

.flower-frame{
  position:relative;
  padding:4px;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:22px;
}

.flower-frame::before{
  content:"";
  position:absolute;
  inset:-150%;
  background:linear-gradient(90deg,transparent,#ff9eb5,#333,#ff6f91,transparent);
  animation:TRAIN 16s linear infinite;
}

@keyframes TRAIN{
  from{transform:translateX(-50%) rotate(0deg)}
  to{transform:translateX(50%) rotate(360deg)}
}

.flower-frame video{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:18px;
  background:#000;
}

.subtitle{
  font-size:17px;
  margin-bottom:22px;
}

.music-btn{
  width:100%;
  padding:14px;
  border-radius:999px;
  border:none;
  margin-bottom:20px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(135deg,#ff9eb5,#ff6f91);
}

.card a{
  display:block;
  margin:10px 0;
  padding:13px;
  border-radius:26px;
  background:rgba(0,0,0,.45);
  color:#ffd0dc;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">
  <div class="flower-frame">
    <video id="heroVideo" muted loop playsinline poster="poster.jpg">
      <source src="her-video.mp4" type="video/mp4">
    </video>
  </div>

  <p class="subtitle">I made this little space just for us</p>

  <button class="music-btn" id="musicBtn">Tap for music 🎵</button>

  <a href="#">Secret</a>
  <a href="#">Us</a>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const video = document.getElementById("heroVideo");
const music = document.getElementById("bgMusic");
const btn = document.getElementById("musicBtn");

/* FORCE VIDEO START */
window.addEventListener("DOMContentLoaded", () => {
  video.load();
  const tryPlay = video.play();
  if (tryPlay !== undefined) {
    tryPlay.catch(() => {});
  }
});

/* MUSIC */
btn.addEventListener("click", () => {
  music.volume = 0.6;
  music.play();
  btn.textContent = "Playing 🎶";
  btn.disabled = true;
});
</script>

</body>
</html>
