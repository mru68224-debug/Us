<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Us</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  min-height: 100%;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
}
.container {
  max-width: 420px;
  width: 90%;
  text-align: center;
}
h1 {
  color: #fff;
  margin-bottom: 24px;
}
.button-link {
  display: block;
  margin: 12px 0;
  padding: 14px;
  border-radius: 24px;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  color: #fff;
  background: linear-gradient(135deg, #ff9eb5, #ff6f91);
  box-shadow: 0 8px 24px rgba(255,111,145,0.5);
  transition: transform 0.15s ease, background 0.25s ease;
}
.button-link:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #ff6f91, #ff9eb5);
}
</style>
</head>

<div class="container">
  <h1>Our Little Space</h1>

  <a href="prettiest.html" class="button-link">Prettiest</a>
