<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <link rel="stylesheet" href="style.css">
    <!-- For the cute font -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- OVERLAY: This blocks the site until she clicks "Start" (Required for music to play) -->
    <div id="start-overlay">
        <div class="card">
            <h1>Hey Beautiful... 💖</h1>
            <p>I made something special for you.</p>
            <button id="start-btn">Tap to Open</button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container hidden" id="main-content">
        
        <!-- Header & Photo -->
        <div class="photo-frame">
            <img src="her_photo.jpg" alt="Us 💕">
        </div>
        <h1 class="title">Counting Down to Your Special Day</h1>

        <!-- Countdown Timer -->
        <div id="countdown">
            <div class="time-box"><span id="days">000</span><label>Days</label></div>
            <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
            <div class="time-box"><span id="mins">00</span><label>Mins</label></div>
            <div class="time-box"><span id="secs">00</span><label>Secs</label></div>
        </div>

        <!-- The Game Section -->
        <div class="game-section">
            <h2>Play to unlock a secret message! 🤫</h2>
            <p>Score <span id="target-score">5</span> points by clicking the hearts!</p>
            <p>Score: <span id="score">0</span></p>
            <div id="game-area">
                <!-- Hearts will appear here -->
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <script src="script.js"></script>
</body>
              </html>
