<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Start Screen Overlay -->
    <div id="overlay">
        <div class="envelope-icon">💌</div>
        <h1 class="overlay-text">For My Love</h1>
        <p class="overlay-sub">Tap to Open</p>
    </div>

    <!-- 2. Main Application -->
    <div id="app">
        <!-- Header with Photo & Countdown -->
        <div class="header-card">
            <div class="photo-frame">
                <!-- REPLACE 'her_photo.jpg' with your file name -->
                <img src="her_photo.jpg" alt="Her Photo">
            </div>
            <h2 class="greeting">Something Special</h2>
            <div class="countdown-wrapper">
                <div class="time-card">
                    <span class="time-val" id="days">000</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-card">
                    <span class="time-val" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-card">
                    <span class="time-val" id="mins">00</span>
                    <span class="time-label">Mins</span>
                </div>
                <div class="time-card">
                    <span class="time-val" id="secs">00</span>
                    <span class="time-label">Secs</span>
                </div>
            </div>
            <p class="target-date">Until Feb 18, 2026 ✨</p>
        </div>

        <!-- Memory Game Section -->
        <div class="game-section">
            <h3 class="game-title">Match the Pairs 💕</h3>
            <p class="game-subtitle">Find all matches to unlock the surprise!</p>
            
            <div class="memory-grid" id="gameGrid">
                <!-- Cards generated by JS -->
            </div>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
    </html>
