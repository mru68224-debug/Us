<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Animation -->
    <div class="bg-hearts" id="bg-hearts"></div>

    <!-- START OVERLAY -->
    <div id="start-overlay">
        <div class="start-card">
            <h1>Special Delivery</h1>
            <p>A message from your secret admirer</p>
            <button class="start-btn" id="start-btn">Open Letter </button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container" id="main-content">
        
        <!-- Card 1: Photo & Countdown -->
        <div class="glass-card">
            <div class="photo-wrapper">
                <div class="photo-ring"></div>
                <div class="photo-circle">
                    <img src="her_photo.jpg" alt="My Love">
                </div>
            </div>
            
            <h1 class="title-text">Until your Special Day</h1>
            
            <div class="countdown-container">
                <div class="time-unit">
                    <span class="time-val" id="days">000</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-val" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-val" id="mins">00</span>
                    <span class="time-label">Mins</span>
                </div>
                <div class="time-unit">
                    <span class="time-val" id="secs">00</span>
                    <span class="time-label">Secs</span>
                </div>
            </div>
            <p style="font-size: 0.9rem; opacity: 0.8;">Counting down to Feb 18, 2026 </p>
        </div>

        <!-- Card 2: The Game -->
        <div class="glass-card game-card">
            <h3>Unlock the Secret </h3>
            <p>Catch <span id="target-score">5</span> floating hearts to reveal your surprise!</p>
            <p>Score: <span id="score" style="color: #ff4757; font-weight: bold;">0</span></p>
            <div class="game-area" id="game-area">
                <!-- Hearts spawn here -->
            </div>
        </div>

    </div>

    <!-- Audio -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
