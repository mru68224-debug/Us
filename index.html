<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="lockScreen">
  <div class="lock-box">
    <p class="lock-title">Enter password</p>
    <input type="password" id="mainPass" placeholder="••••••">
    <button onclick="unlock()">Unlock</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="card">
  <div class="flower-frame">
    <video id="heroVideo" muted loop playsinline>
      <source src="her-video.mp4" type="video/mp4">
    </video>
  </div>
  <p class="subtitle">I made this little space just for us</p>
  <button class="music-btn" id="musicBtn">Tap to play 🎶</button>

  <a href="https://swanasoni.in/secret.html">Secret</a>
  <a href="https://swanasoni.in/prettiest.html">Prettiest</a>
  <a href="https://swanasoni.in/cutest.html">Cutest</a>
  <a href="https://swanasoni.in/us.html">Us</a>
</div>

<div class="card message-card">
  <p class="message-text">
    We’ve walked a path that’s anything but smooth.<br>
    Be my Valentine today, tomorrow, and every day we get to stay in this little world we’ve built.
  </p>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const HOME_PASSWORD = "swanappkp";

function unlock() {
  const input = document.getElementById("mainPass").value;
  if(input === HOME_PASSWORD){
    document.getElementById("lockScreen").style.display = "none";

    // music starts
    const music = document.getElementById("bgMusic");
    music.volume = 0.6;
    music.play().catch(()=>{});

    // video plays
    const video = document.getElementById("heroVideo");
    video.play().catch(()=>{});
  } else {
    document.querySelector(".lock-title").innerText = "baby try again mwah";
  }
}

// music toggle button
const btn = document.getElementById("musicBtn");
btn.addEventListener("click", () => {
  const music = document.getElementById("bgMusic");
  if (music.paused) {
    music.play();
    btn.textContent = "Playing 🎶";
  } else {
    music.pause();
    btn.textContent = "Paused ⏸️";
  }
});
</script>

</body>
</html>
