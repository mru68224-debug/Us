<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Us</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ================= MAIN CARD ================= -->
  <div class="card">

    <div class="flower-frame">
      <video src="her-video.mp4" autoplay muted loop playsinline></video>
    </div>

    <p class="subtitle">
      I made this little space just for us
    </p>

    <button class="music-btn" id="musicBtn">
      Tap for music 🎵
    </button>

    <div class="buttons">
      <a href="secret.html">Secret</a>
      <a href="prettiest.html">Prettiest</a>
      <a href="cutest.html">Cutest</a>
      <a href="us.html">Us</a>
    </div>

  </div>

  <!-- ================= MESSAGE CARD ================= -->
  <div class="card message-card">
    <p class="message-text">
      No matter where we are,<br>
      this space will always belong to us.<br><br>
      Quiet, warm, and honest — just like you.
    </p>
  </div>

  <!-- ================= AUDIO ================= -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- ================= JS ================= -->
  <script>
    const music = document.getElementById("bgMusic");
    const btn = document.getElementById("musicBtn");

    btn.addEventListener("click", () => {
      music.volume = 0.6;
      music.play();

      btn.textContent = "Playing 🎶";
      btn.style.opacity = "0.6";
      btn.disabled = true;
    });
  </script>

</body>
</html>
