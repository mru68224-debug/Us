<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Us</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="flower-frame">
        <video 
  src="her-video.mp4"
  autoplay
  muted
  loop
  playsinline
  preload="auto"
  poster="her1.jpg">
        </video>
      </div>

      <p class="subtitle">I made this little space just for us</p>

      <!-- MUSIC BUTTON -->
      <button id="musicBtn" class="music-btn">
        Tap for music 🎵
      </button>

      <div class="buttons">
        <a href="secret.html">Secret</a>
        <a href="prettiest.html">Prettiest</a>
        <a href="cutest.html">Cutest</a>
        <a href="us.html">Us</a>
      </div>

    </div>
  </div>

  <!-- AUDIO -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- JS -->
  <script>
    const music = document.getElementById("bgMusic");
    const btn = document.getElementById("musicBtn");

    let hasPlayed = false;

    btn.addEventListener("click", () => {
      if (hasPlayed) return;

      music.volume = 0.6;

      music.play()
        .then(() => {
          hasPlayed = true;
          btn.textContent = "Playing 🎶";
          btn.disabled = true;
          btn.style.opacity = "0.6";
        })
        .catch(err => {
          console.error(err);
          alert("Browser blocked music. Refresh and tap again.");
        });
    });
  </script>

</body>
</html>
