<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettiest</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.flower-frame {
  position: relative;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  padding: 10px;
  background: conic-gradient(
    #ff6f91 0deg 45deg,
    #ff9eb5 45deg 90deg,
    #ffd1dd 90deg 135deg,
    #ff9eb5 135deg 180deg,
    #ff6f91 180deg 225deg,
    #ff9eb5 225deg 270deg,
    #ffd1dd 270deg 315deg,
    #ff9eb5 315deg 360deg
  );
  display: flex;
  justify-content: center;
  align-items: center;
  animation: spin 12s linear infinite;
}

.flower-frame img {
  width: 90%;
  height: 90%;
  object-fit: cover;
  border-radius: 50%;
  border: 6px solid rgba(255,255,255,0.3);
}

.text-overlay {
  position: absolute;
  bottom: 10px;
  width: 90%;
  text-align: center;
  background: rgba(255,111,145,0.8);
  padding: 10px 0;
  border-radius: 20px;
  color: #fff;
  font-weight: 700;
  font-size: 18px;
  cursor: default;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
</style>
</head>
<body>

<div class="flower-frame">
  <img src="her1.jpg" alt="Her Pic">
  <div class="text-overlay">Prettiest</div>
</div>

</body>
</html>
