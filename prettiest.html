<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettiest</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BASE */
html, body {
  width: 100%;
  min-height: 100%;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* FLOWER FRAME */
.flower-frame {
  position: relative;
  width: 360px;
  height: 500px;
  overflow: hidden;
  border-radius: 28px;
  padding: 8px;
  background: url('https://i.ibb.co/ZYW3VTp/flower-frame.png') no-repeat center/cover;
  box-shadow: 0 15px 40px rgba(255,111,145,0.4);
}

/* HER IMAGE */
.flower-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
  display: block;
  position: relative;
  z-index: 1;
}

/* POETIC TEXT */
.photo-label {
  position: absolute;
  bottom: 20px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #fff;
  font-weight: 600;
  font-size: 16px;
  line-height: 1.5;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  z-index: 2;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="flower-frame">
  <img src="her1.jpg" alt="Her">
  <div class="photo-label">
    Your smile lights up the darkest skies,<br>
    Every glance, a world I adore,<br>
    Quiet magic in every moment we share.
  </div>
</div>

</body>
</html>
