<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettiest</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.flower-frame {
  position: relative;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 0 40px rgba(255,111,145,0.5);
  background: url('flower-frame.png') center/cover no-repeat;
}

.flower-frame img {
  width: 90%;
  height: 90%;
  object-fit: cover;
  border-radius: 50%;
  position: relative;
  z-index: 1;
}

.text-overlay {
  position: absolute;
  bottom: 10px;
  width: 90%;
  text-align: center;
  background: rgba(255,111,145,0.8);
  padding: 10px 0;
  border-radius: 20px;
  color: #fff;
  font-weight: 700;
  font-size: 18px;
  z-index: 2;
  cursor: default;
}
</style>
</head>
<body>

<div class="flower-frame">
  <img src="her1.jpg" alt="Her Pic">
  <div class="text-overlay">Prettiest</div>
</div>

</body>
</html>
