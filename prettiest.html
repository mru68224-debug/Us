<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettiest</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* BODY */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* FLOWER‑LIKE FRAME */
.photo-frame {
  position: relative;
  width: 340px;
  height: 440px;
  padding: 14px;
  background: linear-gradient(135deg, #ff9eb5, #ff6f91, #ffd1dd, #ff9eb5);
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(255,111,145,0.4);
  animation: glow 8s ease infinite;
}

.photo-frame::before {
  content: "";
  position: absolute;
  inset: -8px;
  background: linear-gradient(90deg, #ff6f91, #ff9eb5, #ffc1da, #ff9eb5);
  filter: blur(12px);
  z-index: 0;
}

@keyframes glow {
  0% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(30deg); }
  100% { filter: hue-rotate(0deg); }
}

/* ACTUAL PHOTO */
.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 18px;
  position: relative;
  z-index: 1;
}

/* TEXT LABEL */
.photo-label {
  position: absolute;
  bottom: -14px;
  width: 100%;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,111,145,0.85);
  padding: 8px 0;
  border-radius: 22px;
  left: 0;
  letter-spacing: 0.6px;
}

</style>
</head>
<body>

<div class="photo-frame">
  <img src="her1.jpg" alt="Her Picture">
  <div class="photo-label">Prettiest</div>
</div>

</body>
</html>
