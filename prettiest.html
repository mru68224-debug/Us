<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettiest</title>
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* RECTANGULAR FLOWER FRAME */
.photo-frame {
  position: relative;
  width: 340px;
  height: 440px;
  padding: 12px;
  border-radius: 24px;
  background: linear-gradient(135deg, #ff9eb5, #ff6f91, #ffd1dd, #ff9eb5);
  box-shadow: 0 12px 40px rgba(255,111,145,0.35);
}

/* FAKE FLOWER BORDER */
.photo-frame::before {
  content: "";
  position: absolute;
  inset: -10px;
  background: linear-gradient(90deg, #ff6f91, #ff9eb5, #ffc1da, #ff9eb5);
  border-radius: 28px;
  z-index: 0;
  filter: blur(10px);
}

/* HER PHOTO */
.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 18px;
  position: relative;
  z-index: 1;
}

/* LABEL */
.photo-label {
  position: absolute;
  bottom: -18px;
  width: 100%;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,111,145,0.85);
  padding: 8px 0;
  border-radius: 22px;
}
</style>
</head>
<body>

<div class="photo-frame">
  <img src="her1.jpg" alt="Her Picture">
  <div class="photo-label">You are all i Want snehu</div>
</div>

</body>
</html>
