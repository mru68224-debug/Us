<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prettiest</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f0f11;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.flower-frame {
  position: relative;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  overflow: hidden;
}

.flower-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.flower-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: 8px;
  background: url('flower-frame.png') center/cover no-repeat;
  pointer-events: none;
}

.button-overlay {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.85);
  color: #111;
  font-weight: bold;
  padding: 10px 20px;
  border-radius: 25px;
  font-size: 16px;
  text-align: center;
}
</style>
</head>
<body>

<div class="flower-frame">
  <img src="her-pic.jpg" alt="Her Pic">
  <div class="button-overlay">Prettiest</div>
</div>

</body>
</html>
